<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shush logo">
  <defs>
    <linearGradient id="fg" x1="20" y1="48" x2="120" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f47c20"/>
      <stop offset="1" stop-color="#d9660c"/>
    </linearGradient>
  </defs>

  <!-- rounded tile background (thedevlabs.io near-black) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0e0e10"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#f4f3f1" stroke-opacity="0.07"/>

  <!-- "sh" wordmark in the brand code font -->
  <text x="20" y="82" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="42" font-weight="700" fill="url(#fg)">sh</text>

  <!-- trailing dots: the hushed "sh…", echoing the masked value field -->
  <g fill="url(#fg)">
    <circle cx="78" cy="76" r="6"/>
    <circle cx="96" cy="76" r="6"/>
    <circle cx="114" cy="76" r="6"/>
  </g>
</svg>
